<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b4a7a" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Ride – Rheintal</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="hud" hidden>
      <div class="hud tl">
        <div class="lab">LEISTUNG</div>
        <div class="big" id="pw"></div>
        <div class="mid" id="cad"></div>
        <div class="mid" id="hr"></div>
        <div class="small" id="name"></div>
      </div>
      <div class="hud tr">
        <div class="lab">TEMPO</div>
        <div class="big" id="sp"></div>
        <div class="mid" id="dist"></div>
        <div class="mid" id="time"></div>
        <div class="small" id="alt"></div>
      </div>
      <div class="hud turn" id="turn" hidden></div>
      <div class="hud bl">
        <div class="lab">STEIGUNG</div>
        <div class="big grade" id="gr"></div>
        <div class="small" id="tgr"></div>
        <canvas id="profile" width="160" height="40"></canvas>
      </div>
      <div class="hud br small" id="mode"></div>
      <div class="hud center big" id="pause" hidden>PAUSE</div>
    </div>

    <div id="menu" class="overlay">
      <h1>RIDE</h1>
      <p class="sub">ESCHEN · SCHELLENBERG · M1</p>
      <p id="loading" class="small">LADE WELT …</p>
      <div class="buttons">
        <button id="btn-trainer" disabled>TRAINER VERBINDEN</button>
        <button id="btn-sim" disabled>SIMULATOR</button>
        <button id="btn-auto" disabled>DEMO: AUTOPILOT</button>
        <button id="btn-fly" disabled>DEMO: FLIEGEN</button>
      </div>
      <p class="help small">
        FAHREN: ◄ ▲ ► ABZWEIGUNG · +/− LEISTUNG BZW. KADENZ · P PAUSE · F FLIEGEN · H HUD · V WACKELN · B DITHER · ESC MENÜ<br />
        FLIEGEN: WASD/PFEILE · Q/E RUNTER/RAUF · SHIFT SCHNELL · MAUS ZIEHEN SCHAUEN · RAD TEMPO
      </p>
      <p id="error" class="small err"></p>
      <p id="attribution" class="tiny"></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
